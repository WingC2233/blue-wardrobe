<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌊 藍色旅遊衣櫃 | Blue Wardrobe</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  background: #eaf4ff;
  min-height: 100vh;
  color: #1a3a5c;
  padding: 20px;
}
.container { max-width: 760px; margin: 0 auto; }

/* Header */
header { text-align: center; padding: 30px 20px 20px; }
header h1 {
  font-size: 2em;
  background: linear-gradient(135deg, #1a6fc4, #4da8f7);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
}
header p { color: #6b8db5; font-size: 0.95em; }

/* Card (Aimi 風格 — 白卡片分隔) */
.card {
  background: #fff;
  border-radius: 20px;
  padding: 24px;
  margin-bottom: 18px;
  box-shadow: 0 4px 20px rgba(26,111,196,0.07);
  border: 1px solid #e8f2fd;
}
.card h3 {
  font-size: 1.1em;
  color: #1a3a5c;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card h3 .icon { font-size: 1.3em; }

/* 行程設定 */
.trip-form { display: flex; flex-direction: column; gap: 14px; }
.form-row { display: flex; gap: 10px; flex-wrap: wrap; }
.form-field { flex: 1; min-width: 120px; }
.form-field label { display: block; font-size: 0.78em; color: #6b8db5; font-weight: 600; margin-bottom: 5px; }
.form-field input {
  width: 100%; font-family: inherit; font-size: 0.95em; padding: 11px 14px;
  border-radius: 12px; border: 2px solid #d8e8f8; background: #f7fbff;
  color: #1a3a5c; outline: none; transition: all 0.3s;
}
.form-field input:focus { border-color: #4da8f7; background: #fff; box-shadow: 0 0 0 4px rgba(77,168,247,0.1); }

/* 色系偏好 */
.color-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.color-dot {
  width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
  border: 3px solid transparent; transition: all 0.2s;
}
.color-dot.selected { border-color: #1a6fc4; transform: scale(1.12); box-shadow: 0 0 0 3px rgba(26,111,196,0.15); }
.custom-color-input { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.custom-color-input input {
  flex: 1; min-width: 140px; font-family: inherit; font-size: 0.85em; padding: 9px 12px;
  border-radius: 10px; border: 2px solid #d8e8f8; background: #f7fbff; color: #1a3a5c; outline: none;
}
.custom-tag {
  display: inline-flex; align-items: center; gap: 5px;
  background: #eef7ff; color: #1a6fc4; padding: 4px 12px;
  border-radius: 16px; font-size: 0.8em; font-weight: 600; cursor: pointer; margin: 3px;
}
.custom-tag:hover { background: #d6e9fb; }

/* 行李件數 */
.count-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.count-item {
  display: flex; align-items: center; gap: 6px;
  background: #f7fbff; padding: 8px 12px; border-radius: 12px;
  border: 1px solid #e8f2fd;
}
.count-item label { font-size: 0.8em; font-weight: 600; color: #4a6f94; }
.count-item input {
  width: 52px; padding: 5px 8px; border-radius: 8px;
  border: 2px solid #d8e8f8; font-size: 0.9em; text-align: center; outline: none;
}

/* 按鈕 */
.btn {
  font-family: inherit; font-size: 0.92em; padding: 12px 22px; border: none;
  border-radius: 12px; cursor: pointer; font-weight: 600; transition: all 0.3s;
}
.btn-primary {
  background: linear-gradient(135deg,#1a6fc4,#4da8f7); color:#fff;
  box-shadow: 0 4px 15px rgba(26,111,196,0.25); width: 100%;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(26,111,196,0.35); }
.btn-ghost { background: #eaf4ff; color: #1a6fc4; }
.btn-ghost:hover { background: #d6e9fb; }
.btn-danger { background: #fee8e8; color: #d64040; }
.btn-sm { padding: 8px 14px; font-size: 0.82em; border-radius: 10px; }

/* 紙娃娃 */
.doll-card {
  background: #f7fbff; border-radius: 16px; padding: 18px;
  margin-bottom: 12px; border: 1px solid #e8f2fd;
}
.doll-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px; flex-wrap: wrap; gap: 8px;
}
.doll-day { font-weight: 700; font-size: 1.05em; color: #1a6fc4; }
.doll-actions { display: flex; gap: 6px; }
.doll-body { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
.doll-item { text-align: center; min-width: 56px; }
.doll-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 10px; display: block; margin: 0 auto 4px; }
.doll-item .emoji { font-size: 2em; display: block; margin-bottom: 4px; }
.doll-item .label { font-size: 0.72em; color: #4a6f94; font-weight: 500; }
.doll-item .change-btn { font-size: 0.68em; margin-top: 4px; padding: 5px 10px; }
.doll-desc { margin-top: 12px; }
.doll-desc textarea {
  width: 100%; font-family: inherit; font-size: 0.82em; padding: 8px 12px;
  border-radius: 10px; border: 2px solid #d8e8f8; background: #fff; color: #1a3a5c;
  resize: vertical; min-height: 40px; outline: none;
}

/* 本次行李 */
.luggage-row { display: flex; flex-wrap: wrap; gap: 8px; }
.luggage-item {
  background: #eef7ff; border-radius: 12px; padding: 8px 14px;
  font-size: 0.85em; font-weight: 600; color: #1a6fc4;
  display: flex; align-items: center; gap: 5px;
}

/* 衣櫃 */
.wardrobe-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(130px,1fr)); gap: 12px; }
.w-item {
  background: #f7fbff; border-radius: 14px; padding: 12px 8px; text-align: center;
  transition: all 0.3s; border: 2px solid #e8f2fd; position: relative;
}
.w-item:hover { transform: translateY(-3px); border-color: #4da8f7; box-shadow: 0 6px 20px rgba(26,111,196,0.1); }
.w-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 10px; display: block; margin: 0 auto 6px; }
.w-item .emoji { font-size: 2.4em; display: block; margin-bottom: 5px; }
.w-item .name { font-size: 0.82em; font-weight: 700; display: block; }
.w-item .tag { font-size: 0.7em; opacity: 0.65; display: block; margin-top: 3px; }
.w-item .delete { position: absolute; top: 6px; right: 8px; opacity: 0.4; font-size: 0.85em; cursor: pointer; }
.w-item .delete:hover { opacity: 1; }
.w-item.used { opacity: 0.55; border-style: dashed; }
.upload-btn {
  display: inline-flex; align-items: center; gap: 5px;
  background: #eaf4ff; color: #1a6fc4; padding: 9px 16px;
  border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 0.88em;
  transition: all 0.3s;
}
.upload-btn:hover { background: #d6e9fb; }

/* 穿搭記錄 */
.trip-card {
  background: #f7fbff; border-radius: 14px; padding: 14px; margin-bottom: 10px;
  border: 1px solid #e8f2fd; cursor: pointer; transition: all 0.3s;
}
.trip-card:hover { border-color: #4da8f7; box-shadow: 0 4px 15px rgba(26,111,196,0.1); }
.trip-title { font-weight: 700; margin-bottom: 4px; }
.trip-meta { font-size: 0.8em; color: #6b8db5; }

/* Toast */

.tab-btn {
  flex:1; padding:12px 16px; border:none; border-radius:40px;
  background:transparent; color:#6b8db5; font-size:0.95em;
  font-weight:600; cursor:pointer; transition:all 0.3s;
}
.tab-btn.active {
  background:linear-gradient(135deg,#1a6fc4,#4da8f7);
  color:#fff; box-shadow:0 4px 15px rgba(26,111,196,0.3);
}
.tab-content { display:none; }
.tab-content.active { display:block; animation:fadeIn 0.4s ease; }
@keyframes fadeIn { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:none;} }

.toast {
  position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: #1a3a5c; color: #fff; padding: 12px 24px; border-radius: 30px;
  font-size: 0.9em; opacity: 0; transition: all 0.4s; z-index: 999;
  box-shadow: 0 8px 30px rgba(0,0,0,0.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
footer { text-align: center; margin-top: 20px; color: #a3bfd9; font-size: 0.78em; padding-bottom: 20px; }
.empty-msg { text-align: center; color: #a3bfd9; padding: 30px; font-size: 0.9em; }
@media (max-width: 600px) {
  body { padding: 12px; }
  .card { padding: 18px; }
  .form-field { min-width: 100%; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🌊 藍色旅遊衣櫃</h1>
    <p>快速決定穿什麼、帶什麼！</p>
  </header>

  <!-- Tabs -->
  <div style="display:flex;gap:6px;margin:18px 0;justify-content:center;background:#fff;padding:6px;border-radius:50px;box-shadow:0 4px 20px rgba(26,111,196,0.1)">
    <button class="tab-btn active" onclick="showTab('tab_plan', this)">🧳 穿搭規劃</button>
    <button class="tab-btn" onclick="showTab('tab_wardrobe', this)">👗 衣櫃總覽</button>
    <button class="tab-btn" onclick="showTab('tab_records', this)">📷 穿搭記錄</button>
  </div>

  <!-- Tab: 穿搭規劃 -->
  <div id="tab_plan" class="tab-content active">
  <!-- 🧳 行程設定 -->
  <div class="card">
    <h3><span class="icon">🧳</span> 行程設定</h3>
    <div class="trip-form">
      <div class="form-row">
        <div class="form-field">
          <label>目的地</label>
          <input type="text" id="destination" placeholder="例：東京">
        </div>
        <div class="form-field">
          <label>出發日期</label>
          <input type="date" id="startDate">
        </div>
        <div class="form-field" style="min-width:70px">
          <label>天數</label>
          <input type="number" id="days" min="1" max="30" value="5">
        </div>
        <div class="form-field" style="min-width:70px">
          <label>溫度 °C</label>
          <input type="number" id="tempInput" value="22">
        </div>
      </div>

      <div>
        <label style="font-size:0.78em;color:#6b8db5;font-weight:600;display:block;margin-bottom:8px">🎨 色系偏好</label>
        <div class="color-row" id="colorPrefs"></div>
        <div class="custom-color-input">
          <input type="text" id="customColor" placeholder="自己輸入色系（例：牛仔藍）">
          <button class="btn btn-ghost btn-sm" onclick="addCustomColor()">➕ 加入</button>
        </div>
        <div id="customColorTags" style="margin-top:6px"></div>
      </div>

      <div>
        <label style="font-size:0.78em;color:#6b8db5;font-weight:600;display:block;margin-bottom:8px">🧳 行李件數</label>
        <div class="count-grid" id="countRow"></div>
      </div>

      <button class="btn btn-primary" onclick="generatePlan()">✨ 產生穿搭建議</button>
    </div>
  </div>

  <!-- 🎎 每日紙娃娃 -->
  <div id="planSection" style="display:none">
    <div class="card">
      <h3><span class="icon">🎎</span> 每日紙娃娃</h3>
      <div id="planResult"></div>
    </div>

    <!-- 🧳 本次行李 -->
    <div class="card">
      <h3><span class="icon">🧳</span> 本次行李</h3>
      <div id="luggageList" class="luggage-row"></div>
    </div>
  </div>

  </div><!-- /tab_plan -->

  <!-- Tab: 衣櫃總覽 -->
  <div id="tab_wardrobe" class="tab-content">
  <!-- 👗 衣櫃總覽 -->
  <div class="card">
    <h3><span class="icon">👗</span> 衣櫃總覽</h3>
    <div class="form-row" style="margin-bottom:12px">
      <div class="form-field" style="flex:2">
        <input type="text" id="itemName" placeholder="衣物名稱（例：藍色牛仔褲）">
      </div>
      <div class="form-field" style="min-width:80px">
        <select id="itemCategory" style="width:100%;font-family:inherit;font-size:0.92em;padding:10px 12px;border-radius:12px;border:2px solid #d8e8f8;background:#f7fbff;color:#1a3a5c;outline:none">
          <option value="上衣">上衣</option><option value="下身">下身</option>
          <option value="鞋子">鞋子</option><option value="外套">外套</option>
          <option value="包包">包包</option><option value="飾品">飾品</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="form-field" style="min-width:70px">
        <input type="text" id="itemColor" placeholder="顏色">
      </div>
    </div>
    <div class="form-row" style="margin-bottom:12px;align-items:center">
      <label class="upload-btn">📷 上傳相片
        <input type="file" id="itemPhoto" accept="image/*" style="display:none" onchange="previewPhoto(event)">
      </label>
      <button class="btn btn-primary" style="width:auto;flex:1" onclick="addItem()">➕ 新增衣物</button>
    </div>
    <div id="photoPreview" style="display:none;margin-bottom:10px">
      <img id="photoPreviewImg" style="width:64px;height:64px;object-fit:cover;border-radius:10px;border:2px solid #4da8f7">
      <button class="btn btn-ghost btn-sm" onclick="clearPhoto()" style="margin-left:8px">✕ 移除</button>
    </div>

    <div style="font-size:0.85em;color:#6b8db5;margin-bottom:12px">
      📊 總共 <b id="totalCount">0</b> 件衣物
      <div id="categoryStats" style="margin-top:6px"></div>
    </div>

    <div id="wardrobeGrid" class="wardrobe-grid"></div>

    <div class="form-row" style="margin-top:16px">
      <button class="btn btn-ghost btn-sm" onclick="exportData()">💾 匯出</button>
      <button class="btn btn-ghost btn-sm" onclick="importData()">📥 匯入</button>
      <button class="btn btn-ghost btn-sm" onclick="undoReset()">↩️ 還原</button>
      <button class="btn btn-danger btn-sm" onclick="resetData()">🗑️ 重置</button>
    </div>
    <p style="font-size:0.75em;color:#a3bfd9;margin-top:8px">🔒 資料只會存喺你嘅瀏覽器</p>
  </div>

  </div><!-- /tab_wardrobe -->

  <!-- Tab: 穿搭記錄 -->
  <div id="tab_records" class="tab-content">
  <!-- 📷 穿搭記錄 -->
  <div class="card">
    <h3><span class="icon">📷</span> 穿搭記錄</h3>
    <p style="font-size:0.85em;color:#6b8db5;margin-bottom:14px">真實旅行穿搭靈感，參考打包規劃！</p>
    <div id="tripList"></div>
  </div>

  </div><!-- /tab_records -->

  <footer>🌊 Blue Wardrobe · 資料只存在你嘅瀏覽器</footer>
</div>

<input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
let wardrobe = [];
let planOutfits = [];
let currentPhotoData = '';
let customColors = [];
let lastBackup = null;

const STORAGE_KEY = 'blue_wardrobe_data';
const PLAN_KEY = 'blue_wardrobe_plan';

const COLORS = [
  { name:'藍', hex:'#1a6fc4' }, { name:'天藍', hex:'#4da8f7' },
  { name:'白', hex:'#f5f5f5' }, { name:'黑', hex:'#2a2a2a' },
  { name:'米白', hex:'#f0e6d2' }, { name:'灰', hex:'#9aa5b1' },
  { name:'綠', hex:'#58a05c' }, { name:'粉', hex:'#f4a0b4' },
  { name:'黃', hex:'#f5c542' }, { name:'紫', hex:'#8e7cc3' },
];
let selectedColors = ['藍','天藍','白','米白'];

const COUNT_CATEGORIES = [
  { key:'上衣', label:'上衣', def:4 },
  { key:'下身', label:'下身', def:3 },
  { key:'鞋子', label:'鞋子', def:2 },
  { key:'外套', label:'外套', def:1 },
  { key:'包包', label:'包包', def:1 },
  { key:'飾品', label:'飾品', def:1 },
];

const DEFAULT_ITEMS = [
  { name:'藍色牛仔褲', category:'下身', photo:'https://image.pollinations.ai/prompt/blue%20denim%20jeans%20flat%20lay%20ecommerce%20photo?width=256&height=256&seed=101&nologo=true', color:'藍色' },
  { name:'白色T恤', category:'上衣', photo:'https://image.pollinations.ai/prompt/white%20t-shirt%20flat%20lay%20ecommerce%20photo?width=256&height=256&seed=102&nologo=true', color:'白色' },
  { name:'藍白條紋衫', category:'上衣', photo:'https://image.pollinations.ai/prompt/blue%20white%20striped%20t-shirt%20flat%20lay%20ecommerce%20photo?width=256&height=256&seed=103&nologo=true', color:'藍白' },
  { name:'運動鞋', category:'鞋子', photo:'https://image.pollinations.ai/prompt/white%20sneakers%20ecommerce%20photo?width=256&height=256&seed=104&nologo=true', color:'白色' },
  { name:'涼鞋', category:'鞋子', photo:'https://image.pollinations.ai/prompt/blue%20sandals%20ecommerce%20photo?width=256&height=256&seed=105&nologo=true', color:'藍色' },
  { name:'薄外套', category:'外套', photo:'https://image.pollinations.ai/prompt/light%20blue%20jacket%20flat%20lay%20ecommerce%20photo?width=256&height=256&seed=106&nologo=true', color:'淺藍' },
  { name:'後背包', category:'包包', photo:'https://image.pollinations.ai/prompt/navy%20blue%20backpack%20ecommerce%20photo?width=256&height=256&seed=107&nologo=true', color:'深藍' },
  { name:'漁夫帽', category:'飾品', photo:'https://image.pollinations.ai/prompt/blue%20cap%20hat%20ecommerce%20photo?width=256&height=256&seed=108&nologo=true', color:'藍色' },
  { name:'太陽眼鏡', category:'飾品', photo:'https://image.pollinations.ai/prompt/black%20sunglasses%20ecommerce%20photo?width=256&height=256&seed=109&nologo=true', color:'黑色' },
  { name:'藍色連身裙', category:'下身', photo:'https://image.pollinations.ai/prompt/blue%20dress%20flat%20lay%20ecommerce%20photo?width=256&height=256&seed=110&nologo=true', color:'藍色' },
  { name:'運動短褲', category:'下身', photo:'https://image.pollinations.ai/prompt/navy%20blue%20shorts%20flat%20lay%20ecommerce%20photo?width=256&height=256&seed=111&nologo=true', color:'深藍' },
  { name:'針織開衫', category:'外套', photo:'https://image.pollinations.ai/prompt/sky%20blue%20cardigan%20flat%20lay%20ecommerce%20photo?width=256&height=256&seed=112&nologo=true', color:'天藍' },
];

const TRIPS = [
  { title:'🇯🇵 東京 5日4夜', meta:'2026年3月 · 賞櫻 · 10-15°C', days:'Day 1 淺草 · Day 2 澀谷 · Day 3 迪士尼 · Day 4 鎌倉 · Day 5 回程', emojis:'🧥👖👟🎒' },
  { title:'🇹🇭 曼谷 4日3夜', meta:'2025年11月 · 水燈節 · 28-32°C', days:'Day 1 夜市 · Day 2 水上市場 · Day 3 大皇宮 · Day 4 回程', emojis:'👕🩳🩴🕶️' },
  { title:'🇳🇿 紐西蘭南島自駕 15日', meta:'2025年1月 · 夏天 · 15-25°C', days:'冰川健行 · 皇后鎮 · 螢火蟲洞 · 峽灣', emojis:'🧥👖👟🎒🧢' },
];

function showTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
  document.getElementById(name).classList.add('active');
  if (btn) btn.classList.add('active');
}

function init() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try { wardrobe = JSON.parse(saved); } catch(e) { wardrobe = [...DEFAULT_ITEMS]; }
  } else { wardrobe = [...DEFAULT_ITEMS]; }
  const plan = localStorage.getItem(PLAN_KEY);
  if (plan) {
    try { planOutfits = JSON.parse(plan); } catch(e) { planOutfits = []; }
  }
  renderColorPrefs();
  renderCountRow();
  renderTripList();
  renderAll();
  renderPlan();
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(wardrobe)); }
function savePlan() { localStorage.setItem(PLAN_KEY, JSON.stringify(planOutfits)); }

function showToast(msg) {
  let t = document.querySelector('.toast');
  if (!t) { t = document.createElement('div'); t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

/* 色系 */
function renderColorPrefs() {
  const box = document.getElementById('colorPrefs');
  box.innerHTML = COLORS.map(c =>
    `<div class="color-dot ${selectedColors.includes(c.name)?'selected':''}"
         style="background:${c.hex}" title="${c.name}"
         onclick="toggleColor('${c.name}')"></div>`
  ).join('');
  renderCustomColorTags();
}
function toggleColor(name) {
  if (selectedColors.includes(name)) selectedColors = selectedColors.filter(c => c !== name);
  else selectedColors.push(name);
  renderColorPrefs();
}
function addCustomColor() {
  const input = document.getElementById('customColor').value.trim();
  if (!input) { showToast('⚠️ 請輸入顏色'); return; }
  if (!customColors.includes(input)) {
    customColors.push(input);
    if (!selectedColors.includes(input)) selectedColors.push(input);
    document.getElementById('customColor').value = '';
    renderColorPrefs();
    showToast(`✅ 已加入「${input}」`);
  } else showToast('⚠️ 呢個色已經加咗');
}
function removeCustomColor(name) {
  customColors = customColors.filter(c => c !== name);
  selectedColors = selectedColors.filter(c => c !== name);
  renderColorPrefs();
}
function renderCustomColorTags() {
  const box = document.getElementById('customColorTags');
  if (!box) return;
  box.innerHTML = customColors.map(c =>
    `<span class="custom-tag" onclick="removeCustomColor('${c}')">${c} ✕</span>`
  ).join('');
}

/* 行李件數 */
function renderCountRow() {
  const box = document.getElementById('countRow');
  box.innerHTML = COUNT_CATEGORIES.map(c =>
    `<div class="count-item"><label>${c.label}</label>
     <input type="number" id="count_${c.key}" value="${c.def}" min="0" max="10"></div>`
  ).join('');
}
function getCounts() {
  const counts = {};
  COUNT_CATEGORIES.forEach(c => { counts[c.key] = parseInt(document.getElementById(`count_${c.key}`).value) || 0; });
  return counts;
}

/* 相片 */
function previewPhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxSize = 300;
      let w = img.width, h = img.height;
      if (w > maxSize || h > maxSize) {
        const ratio = Math.min(maxSize/w, maxSize/h);
        w = Math.round(w*ratio); h = Math.round(h*ratio);
      }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      currentPhotoData = canvas.toDataURL('image/jpeg', 0.7);
      document.getElementById('photoPreviewImg').src = currentPhotoData;
      document.getElementById('photoPreview').style.display = 'block';
      showToast('📷 相片已加！');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function clearPhoto() {
  currentPhotoData = '';
  document.getElementById('photoPreview').style.display = 'none';
  document.getElementById('itemPhoto').value = '';
}

/* 衣櫃 */
function addItem() {
  const name = document.getElementById('itemName').value.trim();
  const category = document.getElementById('itemCategory').value;
  const color = document.getElementById('itemColor').value.trim();
  if (!name) { showToast('⚠️ 請輸入衣物名稱！'); return; }
  wardrobe.push({ name, category, photo: currentPhotoData || '', color });
  save();
  document.getElementById('itemName').value='';
  document.getElementById('itemColor').value='';
  clearPhoto();
  renderAll();
  showToast('✅ 已新增');
}
function deleteItem(index) {
  wardrobe.splice(index, 1);
  save();
  renderAll();
}
function renderAll() {
  const grid = document.getElementById('wardrobeGrid');
  grid.innerHTML = wardrobe.length ? wardrobe.map((item, idx) => {
    const used = planOutfits.some(o => o.items && Object.values(o.items).includes(idx));
    const visual = item.photo
      ? `<img src="${item.photo}">`
      : `<span class="emoji">${item.emoji || '👕'}</span>`;
    return `<div class="w-item ${used?'used':''}">
      <span class="delete" onclick="deleteItem(${idx})">✕</span>
      ${visual}
      <span class="name">${item.name}</span>
      <span class="tag">${item.category}${item.color?' · '+item.color:''}</span>
      ${used?'<span class="tag" style="color:#1a6fc4">✓ 已用</span>':''}
    </div>`;
  }).join('') : '<div class="empty-msg">未有衣物，新增啦～</div>';
  document.getElementById('totalCount').textContent = wardrobe.length;
  const cats = {};
  wardrobe.forEach(i => { cats[i.category] = (cats[i.category]||0)+1; });
  document.getElementById('categoryStats').innerHTML = Object.entries(cats)
    .map(([c,n]) => `<span class="badge" style="display:inline-block;background:#fff;color:#1a6fc4;padding:3px 12px;border-radius:14px;font-size:0.78em;font-weight:600;margin:3px;box-shadow:0 2px 6px rgba(26,111,196,0.08)">${c} × ${n}</span>`).join('');
}

/* 生成計劃 */
function generatePlan() {
  const dest = document.getElementById('destination').value.trim() || '旅行';
  const days = parseInt(document.getElementById('days').value) || 5;
  const temp = parseInt(document.getElementById('tempInput').value) || 22;

  let pool = wardrobe.filter(i => selectedColors.some(c => (i.color||'').includes(c)));
  if (pool.length < 3) pool = wardrobe;

  const tops = pool.filter(i => i.category === '上衣');
  const bottoms = pool.filter(i => i.category === '下身');
  const shoes = pool.filter(i => i.category === '鞋子');
  const extras = pool.filter(i => ['外套','包包','飾品'].includes(i.category));

  if (!tops.length || !bottoms.length || !shoes.length) {
    showToast('⚠️ 衣櫃唔夠衫！至少要有上衣、下身、鞋子');
    return;
  }

  const pick = (arr, seed) => arr.length ? arr[seed % arr.length] : null;
  const isCold = temp < 18;
  const isHot = temp > 28;

  planOutfits = [];
  for (let d = 1; d <= days; d++) {
    const top = pick(tops, d*2);
    const bottom = pick(bottoms, d*3+1);
    const shoe = pick(shoes, d*5);
    const extra = extras.length ? pick(extras, d*7) : null;
    planOutfits.push({
      day: d,
      items: {
        上衣: top ? tops.indexOf(top) : null,
        下身: bottom ? bottoms.indexOf(bottom) : null,
        鞋子: shoe ? shoes.indexOf(shoe) : null,
        外套: extra ? extras.indexOf(extra) : null,
      },
      desc: ''
    });
  }
  savePlan();
  document.getElementById('planSection').style.display = 'block';
  renderPlan();
  renderLuggage();
  showToast(`✨ ${dest} ${days}日穿搭建議已產生！`);
}

function renderPlan() {
  const result = document.getElementById('planResult');
  if (!planOutfits.length) {
    result.innerHTML = '<div class="empty-msg">未產生計劃 — 設定好行程，撳「產生穿搭建議」！</div>';
    return;
  }
  let html = '';
  planOutfits.forEach((o, idx) => {
    html += `<div class="doll-card">
      <div class="doll-head">
        <span class="doll-day">Day ${o.day}</span>
        <div class="doll-actions">
          <button class="btn btn-ghost btn-sm" onclick="downloadOutfit(${idx})">📸 下載</button>
          <button class="btn btn-danger btn-sm" onclick="removeDay(${idx})">✕</button>
        </div>
      </div>
      <div class="doll-body" id="clothes_${idx}"></div>
      <div class="doll-desc">
        <textarea placeholder="行程描述：例如 Day 1 淺草行，行街為主..." oninput="updateDesc(${idx}, this.value)">${o.desc||''}</textarea>
      </div>
    </div>`;
  });
  html += `<div class="form-row" style="margin-top:12px">
    <button class="btn btn-ghost" onclick="window.print()" style="flex:1">🖨️ 列印 / 存 PDF</button>
    <button class="btn btn-ghost" onclick="clearPlan()" style="flex:1">🗑️ 清空</button>
  </div>`;
  result.innerHTML = html;

  planOutfits.forEach((o, idx) => {
    const box = document.getElementById(`clothes_${idx}`);
    if (!box) return;
    let inner = '';
    for (const [cat, itemIdx] of Object.entries(o.items)) {
      if (itemIdx === null || itemIdx === undefined) continue;
      const items = wardrobe.filter(i => i.category === cat);
      if (!items.length) continue;
      const item = items[itemIdx % items.length];
      inner += `<div class="doll-item">
        ${item.photo
          ? `<img src="${item.photo}">`
          : `<span class="emoji">${item.emoji || '👕'}</span>`}
        <div class="label">${item.name}</div>
        <button class="btn btn-ghost btn-sm change-btn" onclick="changeItem(${idx},'${cat}')">🔄 換</button>
      </div>`;
    }
    box.innerHTML = inner;
  });
}

function renderLuggage() {
  const box = document.getElementById('luggageList');
  if (!planOutfits.length) { box.innerHTML = ''; return; }
  // 統計計劃用咗幾多件
  const used = {};
  planOutfits.forEach(o => {
    for (const [cat, itemIdx] of Object.entries(o.items)) {
      if (itemIdx === null || itemIdx === undefined) continue;
      const items = wardrobe.filter(i => i.category === cat);
      if (!items.length) continue;
      const item = items[itemIdx % items.length];
      used[cat] = (used[cat]||0)+1;
    }
  });
  const counts = getCounts();
  box.innerHTML = COUNT_CATEGORIES.map(c => {
    const planned = used[c.key] || 0;
    const target = counts[c.key] || 0;
    return `<div class="luggage-item">${c.label} × ${planned}/${target}</div>`;
  }).join('');
}

function changeItem(outfitIdx, category) {
  const items = wardrobe.filter(i => i.category === category);
  if (!items.length) { showToast('⚠️ 冇呢類衣物'); return; }
  const current = planOutfits[outfitIdx].items[category] || 0;
  planOutfits[outfitIdx].items[category] = (current + 1) % items.length;
  savePlan();
  renderPlan();
  renderLuggage();
}
function updateDesc(idx, val) { planOutfits[idx].desc = val; savePlan(); }
function removeDay(idx) { planOutfits.splice(idx, 1); savePlan(); renderPlan(); renderLuggage(); }
function clearPlan() {
  if (confirm('確定清空計劃？')) {
    planOutfits = [];
    localStorage.removeItem(PLAN_KEY);
    renderPlan();
    renderLuggage();
    document.getElementById('planSection').style.display = 'none';
  }
}
function downloadOutfit(idx) {
  const outfit = planOutfits[idx];
  if (!outfit) return;
  const canvas = document.createElement('canvas');
  canvas.width = 600; canvas.height = 500;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 600, 500);
  ctx.fillStyle = '#1a6fc4';
  ctx.font = 'bold 28px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`🌊 Day ${outfit.day}`, 300, 50);
  let y = 130;
  for (const [cat, itemIdx] of Object.entries(outfit.items)) {
    if (itemIdx === null || itemIdx === undefined) continue;
    const items = wardrobe.filter(i => i.category === cat);
    if (!items.length) continue;
    const item = items[itemIdx % items.length];
    if (item.photo) {
      const img = new Image();
      img.src = item.photo;
      // 簡單處理：等圖片 load 先畫（簡化版用文字）
    }
    ctx.font = '64px serif';
    ctx.textAlign = 'center';
    ctx.fillText(item.emoji || '👕', 300, y);
    y += 40;
    ctx.font = '20px sans-serif';
    ctx.fillStyle = '#4a6f94';
    ctx.fillText(item.name, 300, y);
    ctx.fillStyle = '#1a6fc4';
    y += 80;
  }
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = `outfit-day${outfit.day}.png`;
  a.click();
  showToast('📸 已下載 PNG！');
}

/* 資料管理 */
function exportData() {
  const blob = new Blob([JSON.stringify(wardrobe, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'blue-wardrobe.json';
  a.click();
  showToast('💾 已匯出');
}
function importData() { document.getElementById('importFile').click(); }
function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (Array.isArray(data)) {
        wardrobe = data;
        save();
        renderAll();
        showToast('✅ 匯入成功！');
      }
    } catch(err) { showToast('❌ 檔案格式錯誤'); }
  };
  reader.readAsText(file);
}
function resetData() {
  if (confirm('確定重置衣櫃？')) {
    lastBackup = JSON.stringify(wardrobe);
    wardrobe = [...DEFAULT_ITEMS];
    save();
    renderAll();
    showToast('🗑️ 已重置（可還原）');
  }
}
function undoReset() {
  if (lastBackup) {
    wardrobe = JSON.parse(lastBackup);
    lastBackup = null;
    save();
    renderAll();
    showToast('↩️ 已還原');
  } else showToast('冇嘢可以還原');
}

/* 穿搭記錄 */
function renderTripList() {
  const box = document.getElementById('tripList');
  box.innerHTML = TRIPS.map(t => `
    <div class="trip-card" onclick="showToast('📷 ${t.title} — 參考用')">
      <div class="trip-title">${t.title} ${t.emojis}</div>
      <div class="trip-meta">${t.meta}</div>
      <div class="trip-meta" style="margin-top:4px">${t.days}</div>
    </div>
  `).join('');
}

init();
